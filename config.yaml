# kyverno-assistant — Hermes profile config.
#
# Security-critical, hand-edited only. Enforcement is layered, each layer
# independently verified against the real upstream servers (see
# docs/architecture.md for how and when):
#
#   1. mcp_servers.<name>.env (GITHUB_TOOLSETS/GITHUB_EXCLUDE_TOOLS,
#      SLACK_MCP_ENABLED_TOOLS below) — the upstream MCP server itself never
#      advertises the excluded tools. Confirmed by running both real
#      containers and diffing their actual `tools/list` response against
#      this file's tool names.
#   2. mcp_servers.<name>.tools.include below — Hermes' own per-tool filter,
#      matched against the server's raw (unprefixed) tool names. Belt and
#      suspenders with (1): even a server that ignores its exclude env var
#      can't get an excluded tool registered into the agent's toolset.
#   3. hooks.pre_tool_call below — a shell hook, scoped by its `matcher` to
#      only fire on a tool name matching *merge*/*delete_repo*/*force_push*,
#      independent of whether that tool was ever supposed to be registered.
#      Hermes shell hooks fail OPEN by default (crash/timeout/malformed
#      stdout → warn and allow) — wrong for a security gate, which is why
#      `fail_closed: true` is set here to invert it. Still a backstop for a
#      misconfiguration in (1)/(2), not the primary control — those don't
#      depend on a subprocess succeeding.
#
# Do not add a tool to any layer below without re-running the verification
# in docs/architecture.md.

model:
  default: "anthropic/claude-sonnet-4-6"

mcp_servers:
  github:
    command: docker
    args:
      - run
      - -i
      - --rm
      - -e
      - GITHUB_PERSONAL_ACCESS_TOKEN
      - -e
      - GITHUB_LOCKDOWN_MODE
      - -e
      - GITHUB_TOOLSETS
      - -e
      - GITHUB_EXCLUDE_TOOLS
      - ghcr.io/github/github-mcp-server
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"
      # Lockdown mode filters content from accounts without push access —
      # this agent reads community PR/issue bodies and comments and can act
      # on them (labels, reviews), so treat that content as adversarial by
      # default. Best-effort content filter, not an authorization boundary;
      # (1)/(2)/(3) above are what actually limit privileged actions.
      GITHUB_LOCKDOWN_MODE: "1"
      # `all` on purpose: GITHUB_EXCLUDE_TOOLS below is the real gate, and
      # naming toolset *groups* here instead risks silently missing a tool
      # this profile needs (verified live: the default toolset omits
      # labels/git/code_security/dependabot/secret_protection/actions
      # entirely). Widen here, narrow with an explicit list, not vice versa.
      GITHUB_TOOLSETS: "all"
      # Everything NOT in mcp_servers.github.tools.include below, by name.
      # Generated as (full `all`-toolset tool list) minus (tools.include) —
      # keep these two lists as exact complements of each other.
      GITHUB_EXCLUDE_TOOLS: >-
        actions_run_trigger,assign_copilot_to_issue,assign_copilot_to_issue_with_intent,
        create_branch,create_gist,create_or_update_file,create_pull_request,
        create_repository,create_repository_ruleset,custom_properties_read,
        custom_properties_write,delete_file,discussion_comment_write,
        dismiss_notification,fork_repository,get_code_quality_finding,get_commit,
        get_discussion,get_discussion_comments,get_gist,get_global_security_advisory,
        get_me,get_notification_details,get_release_by_tag,get_tag,label_write,
        list_branches,list_commits,list_discussion_categories,list_discussions,
        list_gists,list_global_security_advisories,list_issue_fields,
        list_issue_types,list_notifications,list_org_repository_security_advisories,
        list_repository_collaborators,list_repository_security_advisories,
        list_starred_repositories,list_tags,manage_notification_subscription,
        manage_repository_notification_subscription,mark_all_notifications_read,
        merge_pull_request,projects_get,projects_list,projects_write,push_files,
        repository_ruleset_read,search_code,search_commits,search_orgs,
        search_repositories,search_users,star_repository,sub_issue_write,
        unstar_repository,update_gist,update_pull_request
    tools:
      # PR queue reads — pull_request_read is one multiplexed tool (method:
      # get/get_diff/get_status/get_files/get_commits/get_reviews/
      # get_review_comments/get_comments/get_check_runs). search_pull_requests
      # covers milestone:/review-requested:/label: query syntax, which is how
      # "requested reviewer" filtering and milestone/release-urgency reasoning
      # both work — there's no separate milestone-listing tool.
      #
      # Related-issue reads — issue_read's 'get' method returns
      # closed_by_pull_requests, the real signal for "which PR closes which
      # issue" rather than guessing from text.
      #
      # Label taxonomy + CODEOWNERS — read live, never hardcoded (see
      # skills/kyverno-context). get_team_members/get_teams resolve
      # team-based CODEOWNERS entries against MAINTAINER_GITHUB_LOGIN.
      #
      # Risk enrichment for queue reasoning — read-only.
      #
      # Actions using the maintainer's own token — label, comment, review,
      # rebase, and requesting a Copilot review if one's missing. issue_write
      # is broader than "just labels" (can also touch state/assignees/
      # milestone) — SOUL.md/pr-actions instruct the agent to only ever pass
      # `labels` on it.
      include:
        - list_pull_requests
        - search_pull_requests
        - pull_request_read
        - issue_read
        - list_issues
        - search_issues
        - list_label
        - get_label
        - get_file_contents
        - get_repository_tree
        - get_team_members
        - get_teams
        - list_releases
        - get_latest_release
        - list_code_scanning_alerts
        - get_code_scanning_alert
        - list_dependabot_alerts
        - get_dependabot_alert
        - list_secret_scanning_alerts
        - get_secret_scanning_alert
        - actions_list
        - actions_get
        - get_job_logs
        - issue_write
        - add_issue_comment
        - update_issue_comment
        - pull_request_review_write
        - add_comment_to_pending_review
        - add_reply_to_pull_request_comment
        - update_pull_request_branch
        - request_copilot_review

  slack:
    command: docker
    args:
      - run
      - -i
      - --rm
      - -e
      - SLACK_MCP_XOXB_TOKEN
      - -e
      - SLACK_MCP_ADD_MESSAGE_TOOL
      - -e
      - SLACK_MCP_ENABLED_TOOLS
      - ghcr.io/korotovsky/slack-mcp-server:latest
      - --transport
      - stdio
    env:
      SLACK_MCP_XOXB_TOKEN: "${SLACK_BOT_TOKEN}"
      # conversations_add_message is disabled by default in this server.
      # Setting this to a channel ID (rather than 'true') enables posting
      # only in that one channel, not the whole workspace.
      SLACK_MCP_ADD_MESSAGE_TOOL: "${SLACK_HOME_CHANNEL}"
      # Do NOT list conversations_add_message here too: per this server's
      # own docs, listing a write tool in SLACK_MCP_ENABLED_TOOLS enables it
      # "without channel restrictions" — that would silently undo the
      # SLACK_MCP_ADD_MESSAGE_TOOL channel scoping above. Leave write tools
      # to their dedicated env var; use this one only to narrow the
      # always-on read tools down to what's actually needed.
      SLACK_MCP_ENABLED_TOOLS: "conversations_history"
    tools:
      # Read the maintainers channel for priority signals, reply there.
      include:
        - conversations_history
        - conversations_add_message

# Compose the two narrowed MCP toolsets into one named grant. Each is
# already reduced to its verified tool list by mcp_servers.*.tools.include
# above — this just groups them; it does not do any filtering of its own.
custom_toolsets:
  kyverno-assistant-tools:
    - mcp-github
    - mcp-slack

toolsets: ["kyverno-assistant-tools"]

hooks:
  pre_tool_call:
    - matcher: "merge|delete_repo|force_push"
      command: "./hooks/block-dangerous-tools.sh"
      timeout: 10
      fail_closed: true

platforms:
  slack:
    reply_to_mode: "first"
    typing_status_text: "checking the queue..."
    require_mention: true
    extra:
      reply_in_thread: true
      reply_broadcast: false

plugins:
  enabled: []
agent: {}
