# kyctrl maintainer settings
#
# This is the ONE place maintainers tune bot behavior. It is separate from
# config.yaml on purpose:
#
#   config.yaml   -> Hermes routing + tool grants (security-critical,
#                    reviewed like code, changes who can do what)
#   settings.yaml -> business thresholds and toggles (safe for any
#                    maintainer to edit without touching Hermes internals)
#
# Every deterministic engine and skill reads its tunables from here instead
# of hardcoding them. A later observability/settings SPA (see the build
# plan's final phase) will read and write this same file, so "one place"
# stays true once a UI exists too.
#
# Changing a value here changes behavior on the NEXT webhook event handled —
# no Hermes restart required, since scripts/*.py re-read this file on
# every invocation.

version: 1

global:
  # Bot identity used to gate trigger comments in GitHub Actions workflows.
  bot_login: "kyctrl-bot"
  # Logins treated as a GitHub Copilot code review, checked by every bot
  # that reasons about a PR (skills/copilot-review-check.md). Add to this
  # list if GitHub renames/adds a Copilot reviewer identity.
  copilot_review_bot_logins:
    - "copilot-pull-request-reviewer[bot]"
    - "github-copilot[bot]"

dependabot_bot:
  enabled: true

  # Ecosystems the policy engine is allowed to APPROVE automatically.
  # Anything else always resolves to FLAG regardless of other signals.
  auto_merge_ecosystems:
    - "github_actions"
    - "gomod"
    - "npm_and_yarn"
    - "docker"

  # Dependabot update types, from weakest to strongest version bump.
  # Any type in this list always FLAGs for human review, no matter what
  # the other checks say.
  always_flag_update_types:
    - "version-update:semver-major"

  # Minimum Socket.dev supply-chain score (0-100) to auto-approve.
  # Below this, the engine FLAGs even if CI is green and metadata checks
  # out. Tune this down cautiously — it is the main supply-chain gate.
  socket_score_threshold: 70

  # Require CI to be green before APPROVE is possible.
  require_ci_pass: true

  # If GitHub Copilot's review on the PR contains any of these signal
  # words (case-insensitive) in a comment, downgrade to FLAG even if
  # every deterministic check passed. This is an additional gate, not a
  # replacement for the checks above.
  copilot_flag_keywords:
    - "vulnerability"
    - "breaking"
    - "security"
    - "do not merge"

  # Known limitation (see docs/architecture.md "Gaps"): regression-history
  # memory lookup (has this exact dependency bump broken CI before?) is not
  # wired up yet — it needs Hermes's per-profile state.db schema understood
  # first. Left here so the field exists once that's built.
  check_regression_history: false

# --- Not yet implemented — placeholders so the schema shape is stable ------
# Each section below gets filled in when that bot's phase starts (see the
# build plan). Leaving them present (rather than omitting the bots
# entirely) means config.yaml's routing table and this file grow together.

triage_bot:
  enabled: false

coach_bot:
  enabled: false

reproduction_bot:
  enabled: false

security_bot:
  enabled: false

pattern_bot:
  enabled: false

qa_bot:
  enabled: false

flaky_bot:
  enabled: false

merge_queue_bot:
  enabled: false
