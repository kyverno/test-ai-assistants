# Per-profile settings for dependabot-bot. Routing, toolsets, and skills
# for this profile are set on the webhook route in the top-level
# ../../config.yaml (the "dependabot-pr" route) — this file only controls
# model behavior for this profile, per Hermes's profile config schema.
#
# Do NOT add a `platforms:` block here — port-binding platforms (webhook,
# api_server, ...) are only ever configured on the default profile, per
# the multi-profile gateway docs. This profile is reached via the
# `profile: dependabot-bot` field on the route, not by binding its own port.

model:
  default: anthropic/claude-sonnet-4-6

terminal:
  backend: local
