# Prototype only: a thin caller of the shared workflow in kyverno/assistant. Not for keeping; removed after the test.
# Every run is a dry run and only reads.
name: Proto reusable caller

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '1,11,21,31,41,51 * * * *'
  pull_request_target:
  workflow_dispatch:
    inputs:
      sleep:
        description: Seconds the shared job stays open (to test concurrency queuing)
        default: '0'

jobs:
  call:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: kyverno/assistant/.github/workflows/proto-reusable-probe.yml@3772f1ae9d451ad92ed849c32cf94e67d7298571
    with:
      dry-run: 'true'
      sleep: ${{ inputs.sleep || '0' }}
