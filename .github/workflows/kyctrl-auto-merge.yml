name: kyctrl auto-merge

# The ONLY place a merge-capable token exists in this whole system. Hermes
# never sees GITHUB_TOKEN — it only posts the comment this workflow reads.
# See docs/architecture.md "the security model".

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: write

jobs:
  merge:
    # Gate on both the exact trigger string and the commenter's identity —
    # the string alone isn't enough, since anyone can comment on a public
    # PR. GitHub's own `github.actor` fallback isn't used here on purpose:
    # comment authorship (`github.event.comment.user.login`) is what
    # actually says who posted it.
    # NOTE: 'kyctrl-bot[bot]' assumes the GitHub App's slug is "kyctrl-bot"
    # (GitHub App bot accounts are always <slug>[bot]). Confirm this against
    # the real login once the App is registered (Phase 0 step 4) and update
    # both here and settings.yaml's global.bot_login if it differs.
    if: >
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/kyctrl-merge approved') &&
      github.event.comment.user.login == 'kyctrl-bot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --auto
