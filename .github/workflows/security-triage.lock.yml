name: "Security advisory triage"
on:
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (Reserved for Agentic Workflows)."
        required: false
        type: string
      ghsa_id:
        description: Triage only this advisory, even if it has not changed since the last run. Empty for the usual pick.
        required: false
        type: string
      model:
        description: "TEST ONLY: the Copilot model the agent uses, to compare how often each one is refused. Empty for the default."
        required: false
        type: string

# Jobs receive only their explicitly declared permissions.
# copilot-requests lets the run use the built-in token for Copilot inference, billed to the organization, so no
# personal access token is stored.
permissions: {}

concurrency:
  group: "gh-aw-${{ github.workflow }}"
  queue: max

run-name: "Security advisory triage"

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
