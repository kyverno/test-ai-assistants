            const { main } = require(path.join(actionsDir, 'parse_mcp_gateway_log.cjs'));
            await main();
      - name: Print firewall logs
        if: always()
        continue-on-error: true
        env:
          AWF_LOGS_DIR: /tmp/gh-aw/sandbox/firewall/logs
        run: bash "${RUNNER_TEMP}/gh-aw/actions/print_firewall_logs.sh" --rootless
      - name: Parse token usage for step summary
        if: always()
        id: parse-token-usage
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'parse_token_usage.cjs'));
            await main();
      - name: Print AWF reflect summary
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'awf_reflect_summary.cjs'));
            await main();
      - name: Generate observability summary
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'generate_observability_summary.cjs'));
            await main(core);
      - name: Write agent output placeholder if missing
        if: always()
        run: |
          if [ ! -f /tmp/gh-aw/agent_output.json ]; then
            echo '{"items":[]}' > /tmp/gh-aw/agent_output.json
          fi
      - if: always()
        name: Keep the lab command log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: security-triage-lab-log
          path: ${{ runner.temp }}/security-triage-lab/commands.jsonl
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '1' }}

      - name: Validate recovery envelopes before upload
        id: validate_final_recovery_envelopes
        if: always() && steps.redact_secrets.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_OBJECT_PACK_MAX_BYTES: ${{ vars.GH_AW_OBJECT_PACK_MAX_BYTES }}
          GH_AW_OBJECT_PACK_MAX_OBJECTS: ${{ vars.GH_AW_OBJECT_PACK_MAX_OBJECTS }}
          GH_AW_OBJECT_PACK_TIMEOUT_MS: ${{ vars.GH_AW_OBJECT_PACK_TIMEOUT_MS }}
          GH_AW_OBJECT_PACK_FETCH_DEPTHS: ${{ vars.GH_AW_OBJECT_PACK_FETCH_DEPTHS }}
          GH_AW_RECOVERY_ADDITIONAL_ROOTS: '["/tmp/gh-aw/aw-prompts/prompt.txt","/tmp/gh-aw/agent_execution.json","/tmp/gh-aw/agent_execution_exit_code.txt","/tmp/gh-aw/agent-session.jsonl","/tmp/gh-aw/agent-errors.jsonl","/tmp/gh-aw/aw-prompts/user.txt","/tmp/gh-aw/aw-prompts/system.txt","/tmp/gh-aw/skill_inventory.json","/tmp/gh-aw/sandbox/agent/logs/","/tmp/gh-aw/redacted-urls.log","/tmp/gh-aw/mcp-logs/","/tmp/gh-aw/mcp-scripts/logs/","/tmp/gh-aw/agent_usage.json","/tmp/gh-aw/runtime/aw_info.json","/tmp/gh-aw/agent_usage.jsonl","/tmp/gh-aw/agent/model-endpoint-mismatch.json","/tmp/gh-aw/agent/model-resolution.json","/tmp/gh-aw/agent-stdio.log","/tmp/gh-aw/agent/harness_retry.json","/tmp/gh-aw/pre-agent-audit.txt","/tmp/gh-aw/github_rate_limits.jsonl","/tmp/gh-aw/otel.jsonl","/tmp/gh-aw/otlp-export-errors.jsonl","/tmp/gh-aw/safeoutputs.jsonl","/tmp/gh-aw/agent_output.json","/tmp/gh-aw","/tmp/gh-aw","/tmp/gh-aw/awf-config.json","/tmp/gh-aw/awf-resolved-config.json","/tmp/gh-aw/sandbox/firewall/logs/","/tmp/gh-aw/sandbox/firewall/audit/","/tmp/gh-aw/sandbox/firewall/awf-reflect.json"]'
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { main } = require(path.join(actionsDir, 'validate_recovery_envelopes.cjs'));
            main({ core, additionalRoots: JSON.parse(process.env.GH_AW_RECOVERY_ADDITIONAL_ROOTS) });
      # Small dedicated copy of the agent output so safe-output processing
      # survives a failed or timed-out upload of the larger agent artifact
      - name: Upload agent output fallback artifact
        if: always() && steps.redact_secrets.outcome == 'success' && steps.validate_recovery_envelopes.outcome == 'success' && steps.validate_final_recovery_envelopes.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-output-fallback
          path: |
            /tmp/gh-aw/agent_output.json
            /tmp/gh-aw/safeoutputs.jsonl
            /tmp/gh-aw/agent_execution.json
            /tmp/gh-aw/agent_execution_exit_code.txt
            /tmp/gh-aw/agent_usage.jsonl
            /tmp/gh-aw/agent_usage.json
            /tmp/gh-aw/agent/harness_retry.json
            /tmp/gh-aw/agent/model-endpoint-mismatch.json
            /tmp/gh-aw/sandbox/firewall-audit-logs/api-proxy-logs/token-usage.jsonl
            /tmp/gh-aw/sandbox/firewall-audit-logs/api-proxy-logs/model-routing.jsonl
            /tmp/gh-aw/sandbox/firewall/logs/api-proxy-logs/token-usage.jsonl
            /tmp/gh-aw/sandbox/firewall/logs/api-proxy-logs/model-routing.jsonl
            /tmp/gh-aw/sandbox/firewall/audit/api-proxy-logs/token-usage.jsonl
            /tmp/gh-aw/sandbox/firewall/audit/api-proxy-logs/model-routing.jsonl
            /tmp/gh-aw/awf-resolved-config.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}
      - name: Upload agent artifacts
        if: always() && steps.redact_secrets.outcome == 'success' && steps.validate_recovery_envelopes.outcome == 'success' && steps.validate_final_recovery_envelopes.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent
          path: |
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/agent_execution.json
            /tmp/gh-aw/agent_execution_exit_code.txt
            /tmp/gh-aw/agent-session.jsonl
            /tmp/gh-aw/agent-errors.jsonl
            /tmp/gh-aw/aw-prompts/user.txt
            /tmp/gh-aw/aw-prompts/system.txt
            /tmp/gh-aw/skill_inventory.json
            /tmp/gh-aw/sandbox/agent/logs/
            /tmp/gh-aw/redacted-urls.log
            /tmp/gh-aw/mcp-logs/
            /tmp/gh-aw/mcp-scripts/logs/
            /tmp/gh-aw/agent_usage.json
            /tmp/gh-aw/runtime/aw_info.json
            /tmp/gh-aw/agent_usage.jsonl
            /tmp/gh-aw/agent/model-endpoint-mismatch.json
            /tmp/gh-aw/agent/model-resolution.json
            /tmp/gh-aw/agent-stdio.log
            /tmp/gh-aw/agent/harness_retry.json
            /tmp/gh-aw/pre-agent-audit.txt
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/otel.jsonl
            /tmp/gh-aw/otlp-export-errors.jsonl
            /tmp/gh-aw/safeoutputs.jsonl
            /tmp/gh-aw/agent_output.json
            /tmp/gh-aw/aw-*.patch
            /tmp/gh-aw/aw-*.bundle
            /tmp/gh-aw/awf-config.json
            /tmp/gh-aw/awf-resolved-config.json
            /tmp/gh-aw/sandbox/firewall/logs/
            /tmp/gh-aw/sandbox/firewall/audit/
            /tmp/gh-aw/sandbox/firewall/awf-reflect.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}

  collect:
    name: collect
    needs: activation
    runs-on: ubuntu-latest
    # Permissions for the collect job (workflow permissions default to none).
    permissions: {}
    outputs:
      count: "${{ steps.collect.outputs.count }}"
    steps:
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Split the target repository
        id: target
        run: |
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET_REPO#*/}" >> "$GITHUB_OUTPUT"
        env:
          TARGET_REPO: suhaani-agarwal/security-triage-sandbox
      - name: Mint the App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SECURITY_TRIAGE_APP_CLIENT_ID }}
          owner: ${{ steps.target.outputs.owner }}
          permission-repository-advisories: read
          private-key: ${{ secrets.SECURITY_TRIAGE_APP_PRIVATE_KEY }}
          repositories: ${{ steps.target.outputs.name }}
      - name: Make sure PyYAML is installed
        run: |
          python3 -c "import yaml" 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
      - id: collect
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          import yaml

          MARKER = re.compile(r"<!-- security-triage:v1 fingerprint=([0-9a-f]{16}) classification=([a-z-]+) -->")
          MAX_DESCRIPTION, MAX_COMMENT, MAX_COMMENTS = 12000, 3000, 10
          # The agent's input is a file, not a job output: GitHub drops a job output that happens to contain the text
          # of any masked secret, and report text can contain anything.
          ADVISORIES_DIR = "/tmp/security-triage-advisories"
          RELEASE = re.compile(r"^v?(\d+)\.(\d+)\.(\d+)$")
          CONSTRAINT = re.compile(r"^(<=|>=|<|>|==|=)?\s*v?(\d+)(?:\.(\d+))?(?:\.(\d+))?$")

          def reported_release(vulnerabilities, releases):
              """The release to test first: the newest published release inside the advisory's version ranges, e.g.
              `<= 1.18.1` gives v1.18.1 and `< 1.19.1` the newest release below it. None if no range can be read."""
              def ver(m):
                  return tuple(int(g or 0) for g in m.groups()[-3:])
              found = []
              for vuln in vulnerabilities or []:
                  text = str((vuln or {}).get("vulnerable_version_range") or "").replace("\\", "").replace("`", "")
                  parts = [p.strip() for p in text.split(",") if p.strip()]
                  constraints = []
                  for part in parts:
                      m = CONSTRAINT.match(part)
                      if not m:
                          constraints = None
                          break
                      constraints.append((m.group(1) or "=", ver(m)))
                  if not constraints:
                      continue
                  tests = {"<=": lambda a, b: a <= b, "<": lambda a, b: a < b, ">=": lambda a, b: a >= b,
                           ">": lambda a, b: a > b, "=": lambda a, b: a == b, "==": lambda a, b: a == b}
                  for tag in releases:
                      m = RELEASE.match(tag)
                      if m and all(tests[op](ver(m), bound) for op, bound in constraints):
                          found.append((ver(m), tag))
              return max(found)[1] if found else None

          def releases_of(repo):
              """Published, non-prerelease release tags of the project, newest first; empty if they cannot be read."""
              r = subprocess.run(["gh", "api", "--paginate", "--slurp", f"repos/{repo}/releases?per_page=100"],
                                 capture_output=True, text=True, env=dict(os.environ, GH_TOKEN=os.environ["RELEASES_TOKEN"]))
              if r.returncode:
                  print(f"::warning::Could not list the releases of {repo}; reported releases are left empty")
                  return []
              return [x["tag_name"] for page in json.loads(r.stdout or "[]") for x in page
                      if not x.get("draft") and not x.get("prerelease")]
          # The Kubernetes manifests in a report are copied into files, exactly as written, so the agent applies them
          # by path instead of retyping them. The text is untrusted: the files are only written, never run, their
          # names come from this script, and their number and size (in bytes, as lab-kubectl checks it) are capped.
          MANIFESTS_DIR = "/tmp/security-triage-manifests"
          MAX_MANIFESTS, MAX_DOC, MAX_TOTAL, MAX_NOTES = 40, 64000, 256000, 10
          FENCE = re.compile(r"^(\s*)(`{3,}|~{3,})(.*)$")
          HEREDOC = re.compile(r"<<-?\s*(['\"]?)([A-Za-z_][A-Za-z0-9_]*)\1")
          DOC_START = re.compile(r"^---(\s.*)?$")
          # Some editors turn a domain into a link even inside a code block, e.g.
          # `apiVersion: [kyverno.io/v1](http://kyverno.io/v1)`. Only a link whose text is its own address is undone.
          AUTOLINK = re.compile(r"\[([^\[\]\s]+)\]\(https?://([^()\s]+?)/?\)")

          def unlink(text):
              return AUTOLINK.sub(lambda m: m.group(1) if m.group(2).rstrip("/") == m.group(1).rstrip("/") else m.group(0), text)

          def fenced_blocks(text):
              """(language, content) of each ``` or ~~~ code block: it closes on a fence of the same character that is at
              least as long, or at the end of the text."""
              blocks, lines, i = [], (text or "").splitlines(), 0
              while i < len(lines):
                  m = FENCE.match(lines[i])
                  if not m or (m.group(2)[0] == "`" and "`" in m.group(3)):
                      i += 1
                      continue
                  indent, fence, info = len(m.group(1)), m.group(2), m.group(3).strip()
                  body, i = [], i + 1
                  while i < len(lines):
                      c = re.match(r"^\s*(`{3,}|~{3,})\s*$", lines[i])
                      if c and c.group(1)[0] == fence[0] and len(c.group(1)) >= len(fence):
                          break
                      line = lines[i]
                      body.append(line[min(indent, len(line) - len(line.lstrip(" "))):])
                      i += 1
                  blocks.append((info.split()[0].lower() if info else "", "\n".join(body)))
                  i += 1
              return blocks

          def heredocs(block):
              """The bodies of shell here-documents in a block, as in `kubectl apply -f - <<EOF ... EOF`."""
              out, lines, i = [], block.splitlines(), 0
              while i < len(lines):
                  m = HEREDOC.search(lines[i])
                  i += 1
                  if not m:
                      continue
                  body = []
                  while i < len(lines) and lines[i].strip() != m.group(2):
                      body.append(lines[i])
                      i += 1
                  out.append("\n".join(body))
                  i += 1
              return out

          def documents(text):
              """The YAML documents in a text, split on `---` lines, each kept exactly as written."""
              docs, cur = [], []
              for line in text.splitlines():
                  if DOC_START.match(line) or line.rstrip() == "...":
                      docs.append("\n".join(cur))
                      cur = []
                  else:
                      cur.append(line)
              docs.append("\n".join(cur))
              return [d for d in docs if d.strip()]

          def safe_name(value, n=40):
              return re.sub(r"[^A-Za-z0-9.-]", "_", str(value or ""))[:n].strip("._-") or "unnamed"

          def manifests_from(sources):
              """The Kubernetes objects in the code blocks of [(label, text)], and notes on what was left out."""
              found, notes, seen, total = [], [], set(), 0
              for label, text in sources:
                  for b, (lang, block) in enumerate(fenced_blocks(text), 1):
                      where = f"{label}, code block {b}"
                      # Here-document bodies first, then the block itself: `<<` also appears in YAML (a CEL `1 << n`),
                      # so a block is never dropped for looking like shell. Repeats are skipped below.
                      for doc in [d for part in heredocs(block) + [block] for d in documents(part)]:
                          fixed = unlink(doc)
                          repaired, doc = fixed != doc, fixed
                          size = len((doc.strip("\n") + "\n").encode())
                          if len(found) >= MAX_MANIFESTS or size > MAX_DOC or total + size > MAX_TOTAL:
                              notes.append(f"{where}: left out, over the size or count limit")
                              continue
                          try:
                              obj = yaml.safe_load(doc)
                          except Exception:
                              if lang in ("yaml", "yml"):
                                  notes.append(f"{where}: not valid YAML, left out")
                              continue
                          if not (isinstance(obj, dict) and obj.get("apiVersion") and obj.get("kind")):
                              continue
                          if obj.get("kind") == "Config" and "clusters" in obj:
                              continue  # a kubeconfig, not something to apply

                          if doc.strip() in seen:
                              continue
                          seen.add(doc.strip())
                          total += size
                          meta = obj.get("metadata") if isinstance(obj.get("metadata"), dict) else {}
                          name = meta.get("name") or meta.get("generateName") or ""
                          found.append({
                              "file": f"{len(found) + 1:02d}-{safe_name(obj['kind'])}-{safe_name(name)}.yaml",
                              "kind": str(obj["kind"])[:60], "name": str(name)[:100],
                              "namespace": str(meta.get("namespace") or "")[:100], "source": where,
                              **({"repaired": "links the report's editor added were removed"} if repaired else {}),
                              "text": doc.strip("\n") + "\n",
                          })
              return found, list(dict.fromkeys(notes))[:MAX_NOTES]

          def write_manifests(todo, advisories, comments_for, root=MANIFESTS_DIR):
              """Write each picked advisory's manifests under root/<GHSA>/ and list them on its entry for the agent.
              They come from the whole description and the same comments the agent sees, before either is cut."""
              by_id = {a["ghsa_id"]: a for a in advisories}
              os.makedirs(root, exist_ok=True)
              with open(os.path.join(root, "README"), "w") as f:
                  f.write("Kubernetes manifests copied from each report, one directory per advisory.\n")
              for item in todo:
                  g = item["ghsa_id"]
                  humans = [c for c in (comments_for(g) or []) if (c.get("user") or {}).get("type") != "Bot"][-MAX_COMMENTS:]
                  sources = [("description", by_id[g].get("description") or "")]
                  sources += [(f"comment {i}", c.get("body") or "") for i, c in enumerate(humans, 1)]
                  found, notes = manifests_from(sources)
                  if found:
                      os.makedirs(os.path.join(root, g), exist_ok=True)
                  for m in found:
                      with open(os.path.join(root, g, m["file"]), "w") as f:
                          f.write(m.pop("text"))
                      m["file"] = f"{g}/{m['file']}"
                  item["manifests"], item["manifest_notes"] = found, notes

          def gh_list(path):
              r = subprocess.run(["gh", "api", "--paginate", "--slurp", path], capture_output=True, text=True)
              if r.returncode:
                  # Never print the response: on a private report it can hold report text.
                  print(f"::warning::GET {path.split('?')[0]} failed (exit {r.returncode})")
                  return None
              out = []
              for page in json.loads(r.stdout or "[]"):
                  out.extend(page if isinstance(page, list) else [page])
              return out

          def cvss_vector(adv):
              return (adv.get("cvss") or {}).get("vector_string") or \
                  ((adv.get("cvss_severities") or {}).get("cvss_v3") or {}).get("vector_string") or ""

          def fingerprint(adv, reporter_comments):
              material = {k: adv.get(k) for k in ("summary", "description", "severity", "cwe_ids", "vulnerabilities")}
              material["cvss"] = cvss_vector(adv)
              material["comments"] = [c.get("body") for c in reporter_comments]
              return hashlib.sha256(json.dumps(material, sort_keys=True).encode()).hexdigest()[:16]

          def bot_comment(comments):
              """The newest comment carrying our marker, written by a bot account."""
              for c in reversed(comments):
                  m = MARKER.search(c.get("body") or "")
                  if m and (c.get("user") or {}).get("type") == "Bot":
                      return c, m.group(1), m.group(2)
              return None, None, None

          def pick(advisories, comments_for, limit, only="", releases=()):
              """Advisories to triage and the index for the posting job. `only` triages that one even if unchanged."""
              todo, index = [], {}
              for adv in sorted(advisories, key=lambda a: a.get("created_at") or ""):
                  if len(todo) >= limit:
                      break
                  g = adv["ghsa_id"]
                  if only and g != only:
                      continue
                  comments = comments_for(g)
                  if comments is None:
                      continue
                  reporter = (adv.get("author") or {}).get("login")
                  reporter_comments = [c for c in comments if (c.get("user") or {}).get("login") == reporter]
                  fp = fingerprint(adv, reporter_comments)
                  mine, old_fp, old_cls = bot_comment(comments)
                  if old_fp == fp and not only:
                      continue
                  humans = [c for c in comments if (c.get("user") or {}).get("type") != "Bot"][-MAX_COMMENTS:]
                  todo.append({
                      "ghsa_id": g, "state": adv.get("state"), "summary": adv.get("summary"),
                      "description": (adv.get("description") or "")[:MAX_DESCRIPTION],
                      "reporter": reporter, "reported_severity": adv.get("severity"),
                      "reported_cvss_vector": cvss_vector(adv), "cwe_ids": adv.get("cwe_ids"),
                      "vulnerabilities": adv.get("vulnerabilities"), "created_at": adv.get("created_at"),
                      "reported_release": reported_release(adv.get("vulnerabilities"), releases),
                      "previous_bot_result": old_cls,
                      "comments": [{"author": (c.get("user") or {}).get("login"),
                                    "is_reporter": (c.get("user") or {}).get("login") == reporter,
                                    "body": (c.get("body") or "")[:MAX_COMMENT]} for c in humans],
                  })
                  index[g] = {"fingerprint": fp, "previous_classification": old_cls,
                              "comment_id": mine["id"] if mine else None,
                              "severity": adv.get("severity"), "cvss_vector": cvss_vector(adv)}
              return todo, index

          def main():
              target, limit = os.environ["TARGET_REPO"], int(os.environ["LIMIT"])
              only = (os.environ.get("ONLY_GHSA") or "").strip()
              if only and not re.fullmatch(r"GHSA(-[23456789cfghjmpqrvwx]{4}){3}", only):
                  raise SystemExit(f"::error::{only!r} is not a GHSA ID")
              advisories = []
              for state in json.loads(os.environ["STATES"]):
                  advisories += gh_list(f"repos/{target}/security-advisories?state={state}&per_page=100") or []
              cache = {}
              def comments_for(g):
                  if g not in cache:
                      cache[g] = gh_list(f"repos/{target}/security-advisories/{g}/comments?per_page=100")
                  return cache[g]
              todo, index = pick(advisories, comments_for, limit, only, releases_of(os.environ["CLI_REPO"]))
              write_manifests(todo, advisories, comments_for)
              # Counts only: the log of a public repository must not carry report text or which reports exist.
              print(f"{sum(len(t['manifests']) for t in todo)} manifest files from the reports to triage")
              published = [{"ghsa_id": a["ghsa_id"], "cve_id": a.get("cve_id"), "summary": a.get("summary"),
                            "severity": a.get("severity"), "cwe_ids": a.get("cwe_ids")}
                           for a in (gh_list(f"repos/{target}/security-advisories?state=published&per_page=100") or [])][:60]
              print(f"{len(advisories)} unpublished advisories, {len(todo)} to triage")
              os.makedirs("/tmp/security-triage-index", exist_ok=True)
              with open("/tmp/security-triage-index/index.json", "w") as f:
                  json.dump(index, f)
              os.makedirs(ADVISORIES_DIR, exist_ok=True)
              with open(os.path.join(ADVISORIES_DIR, "advisories.json"), "w") as f:
                  json.dump({"advisories": todo, "published": published}, f)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"count={len(todo)}\n")

          if os.environ.get("SECURITY_TRIAGE_NO_MAIN") != "1":
              main()
          PY
        env:
          CLI_REPO: kyverno/kyverno
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LIMIT: "1"
          ONLY_GHSA: ${{ inputs.ghsa_id }}
          RELEASES_TOKEN: ${{ github.token }}
          STATES: "[\"triage\",\"draft\"]"
          TARGET_REPO: suhaani-agarwal/security-triage-sandbox
      - name: Keep the index for the posting job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: security-triage-index
          path: /tmp/security-triage-index/index.json
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '1.0' }}
      - name: Keep the advisories for the agent
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: security-triage-advisories
          path: /tmp/security-triage-advisories/advisories.json
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '1.0' }}
      - name: Keep the report manifests for the agent
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: security-triage-manifests
          path: /tmp/security-triage-manifests
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '1.0' }}

  conclusion:
    name: conclusion
    needs:
      - activation
      - agent
      - collect
      - detection
      - post_advisory_verdict
      - record-unfinished
      - safe_outputs
    if: >
      always() && (needs.agent.result != 'skipped' || needs.activation.result == 'failure' || needs.activation.outputs.lockdown_check_failed == 'true' ||
      needs.activation.outputs.oauth_token_check_failed == 'true' || needs.activation.outputs.stale_lock_file_failed == 'true' ||
      needs.activation.outputs.daily_ai_credits_exceeded == 'true' || needs.activation.outputs.daily_ai_credits_guardrail_status == 'structural_error' ||
      needs.activation.outputs.daily_ai_credits_guardrail_status == 'transient_error')
    runs-on: ubuntu-slim
    # Permissions for the conclusion job (workflow permissions default to none).
    permissions:
      actions: read # Read workflow runs and artifacts for workflow context.
      checks: read # Read check runs for workflow context.
      issues: write # Create or update issues and comments.
      pull-requests: read # Read pull requests and review comments for workflow context.
    concurrency:
      group: "gh-aw-conclusion-security-triage"
      cancel-in-progress: false
      queue: max
    env:
      GH_AW_JOB_DISPLAY_NAMES: "{\"activation\":\"activation\",\"agent\":\"agent\",\"collect\":\"collect\",\"conclusion\":\"conclusion\",\"detection\":\"detection\",\"post_advisory_verdict\":\"post_advisory_verdict\",\"record-unfinished\":\"record-unfinished\",\"safe_outputs\":\"safe_outputs\"}"
      GH_AW_JOB_RESULTS: "{\"activation\":{\"result\":\"${{ needs.activation.result }}\"},\"agent\":{\"result\":\"${{ needs.agent.result }}\"},\"collect\":{\"result\":\"${{ needs.collect.result }}\"},\"detection\":{\"result\":\"${{ needs.detection.result }}\"},\"post_advisory_verdict\":{\"result\":\"${{ needs.post_advisory_verdict.result }}\"},\"record-unfinished\":{\"result\":\"${{ needs.record-unfinished.result }}\"},\"safe_outputs\":{\"result\":\"${{ needs.safe_outputs.result }}\"}}"
      GH_AW_JOB_TIMING_ELIGIBLE: "{\"activation\":true,\"agent\":true,\"collect\":true,\"conclusion\":true,\"detection\":true,\"post_advisory_verdict\":true,\"record-unfinished\":true,\"safe_outputs\":true}"
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      incomplete_count: ${{ steps.report_incomplete.outputs.incomplete_count }}
      noop_comment_body: ${{ steps.noop.outputs.noop_comment_body }}
      noop_message: ${{ steps.noop.outputs.noop_message }}
      tools_reported: ${{ steps.missing_tool.outputs.tools_reported }}
      total_count: ${{ steps.missing_tool.outputs.total_count }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@53d0749e19424a918acd82b4d140264ce48f2f14 # v1.2.2
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Security advisory triage"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/security-triage.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.103"
          GH_AW_INFO_AWF_VERSION: "v0.29.11"
          GH_AW_INFO_ENGINE_ID: "copilot"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{agent,agent-output-fallback}"
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          if [ -f "/tmp/gh-aw/agent_output.json" ]; then
            echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Download workflow metadata
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: info
          path: /tmp/gh-aw/
      - name: Restore runtime model metadata
        if: always()
        run: |
          if [ -f /tmp/gh-aw/runtime/aw_info.json ]; then cp /tmp/gh-aw/runtime/aw_info.json /tmp/gh-aw/aw_info.json; fi
      - name: Warn if threat detection produced no verdict
        if: always() && needs.detection.result != 'skipped' && (needs.detection.outputs.detection_reason == 'agent_failure' || needs.detection.outputs.detection_reason == 'parse_error' || needs.detection.outputs.detection_conclusion == '')
        run: echo "::warning::Threat detection produced no security verdict. Review the detection job logs before trusting the agent outputs."
      - name: Download detection artifact
        id: download-detection-artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: detection
          path: /tmp/gh-aw/threat-detection/
      - name: Download Safe Outputs Items Manifest
        id: download-safe-outputs-manifest
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: safe-outputs-items
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Process no-op messages
        id: noop
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_NOOP_MAX: "2"
          GH_AW_WORKFLOW_NAME: "Security advisory triage"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/security-triage.md"
          GH_AW_ENGINE_ID: "copilot"
          GH_AW_ENGINE_MODEL: "${{ inputs.model || 'claude-sonnet-5' }}"
          GH_AW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_AW_AGENT_CONCLUSION: ${{ needs.agent.result }}
          GH_AW_NOOP_REPORT_AS_ISSUE: "false"
          GH_AW_AIC: ${{ needs.agent.outputs.aic }}
          GH_AW_THREAT_DETECTION_AIC: ${{ needs.detection.outputs.aic }}
          GH_AW_AMBIENT_CONTEXT: ${{ needs.agent.outputs.ambient_context }}
          GH_AW_WORKFLOW_ID: "security-triage"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'handle_noop_message.cjs'));
            await main();
      - name: Log detection run
        id: detection_runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_WORKFLOW_NAME: "Security advisory triage"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/security-triage.md"
          GH_AW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_AW_DETECTION_CONCLUSION: ${{ needs.detection.outputs.detection_conclusion }}
          GH_AW_DETECTION_REASON: ${{ needs.detection.outputs.detection_reason }}
          GH_AW_DETECTION_THREAT_KINDS: ${{ needs.detection.outputs.detection_threat_kinds }}
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'handle_detection_runs.cjs'));
            await main();
      - name: Record missing tool
        id: missing_tool
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_MISSING_TOOL_CREATE_ISSUE: "true"
          GH_AW_WORKFLOW_NAME: "Security advisory triage"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/security-triage.md"
          GH_AW_ENGINE_ID: "copilot"
          GH_AW_ENGINE_MODEL: "${{ inputs.model || 'claude-sonnet-5' }}"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'missing_tool.cjs'));
            await main();
      - name: Record incomplete
        id: report_incomplete
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_REPORT_INCOMPLETE_CREATE_ISSUE: "true"
          GH_AW_WORKFLOW_NAME: "Security advisory triage"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/security-triage.md"
          GH_AW_ENGINE_ID: "copilot"
          GH_AW_ENGINE_MODEL: "${{ inputs.model || 'claude-sonnet-5' }}"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'report_incomplete_handler.cjs'));
            await main();
      - name: Handle agent failure
        id: handle_agent_failure
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_WORKFLOW_NAME: "Security advisory triage"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/security-triage.md"
          GH_AW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_AW_AGENT_CONCLUSION: ${{ needs.agent.result }}
          GH_AW_ACTIVATION_RESULT: ${{ needs.activation.result }}
          GH_AW_WORKFLOW_ID: "security-triage"
          GH_AW_ACTION_FAILURE_ISSUE_EXPIRES_HOURS: "0"
          GH_AW_ENGINE_ID: "copilot"
          GH_AW_CHECKOUT_PR_SUCCESS: ${{ needs.agent.outputs.checkout_pr_success }}
          GH_AW_CHECKOUT_PR_INVALIDATED: ${{ needs.agent.outputs.checkout_pr_invalidated }}
          GH_AW_AI_CREDITS_RATE_LIMIT_ERROR: ${{ needs.agent.outputs.ai_credits_rate_limit_error || 'false' }}
          GH_AW_UNKNOWN_MODEL_AI_CREDITS: ${{ needs.agent.outputs.unknown_model_ai_credits || 'false' }}
          GH_AW_AIC: ${{ needs.agent.outputs.aic }}
          GH_AW_THREAT_DETECTION_AIC: ${{ needs.detection.outputs.aic }}
          GH_AW_DETECTION_JOB_RESULT: ${{ needs.detection.result }}
          GH_AW_MAX_AI_CREDITS: "200"
          GH_AW_DEFAULT_CHECKOUT_USES_TRIGGER_REF: "true"
          GH_AW_INFERENCE_ACCESS_ERROR: ${{ needs.agent.outputs.inference_access_error }}
          GH_AW_MCP_POLICY_ERROR: ${{ needs.agent.outputs.mcp_policy_error }}
          GH_AW_AGENTIC_ENGINE_TIMEOUT: ${{ needs.agent.outputs.agentic_engine_timeout }}
          GH_AW_MODEL_NOT_SUPPORTED_ERROR: ${{ needs.agent.outputs.model_not_supported_error }}
          GH_AW_MODEL_ENDPOINT_MISMATCH_ERROR: ${{ needs.agent.outputs.model_endpoint_mismatch_error }}
          GH_AW_HTTP_400_RESPONSE_ERROR: ${{ needs.agent.outputs.http_400_response_error }}
          GH_AW_MAX_CACHE_MISSES_EXCEEDED: ${{ needs.agent.outputs.max_cache_misses_exceeded }}
          GH_AW_MISSING_MODEL_PRICING_ERROR: ${{ needs.agent.outputs.missing_model_pricing_error }}
          GH_AW_MISSING_MODEL_PRICING_MODEL_NAME: ${{ needs.agent.outputs.missing_model_pricing_model_name }}
          GH_AW_SHELL_EXPANSION_GUARD_REJECTED: ${{ needs.agent.outputs.shell_expansion_guard_rejected }}
          GH_AW_ENGINE_API_HOSTS: "api.enterprise.githubcopilot.com,api.githubcopilot.com,api.business.githubcopilot.com,api.individual.githubcopilot.com"
          GH_AW_LOCKDOWN_CHECK_FAILED: ${{ needs.activation.outputs.lockdown_check_failed }}
          GH_AW_OAUTH_TOKEN_CHECK_FAILED: ${{ needs.activation.outputs.oauth_token_check_failed }}
          GH_AW_STALE_LOCK_FILE_FAILED: ${{ needs.activation.outputs.stale_lock_file_failed }}
          GH_AW_DAILY_AI_CREDITS_EXCEEDED: ${{ needs.activation.outputs.daily_ai_credits_exceeded }}
          GH_AW_DAILY_AI_CREDITS_GUARDRAIL_STATUS: ${{ needs.activation.outputs.daily_ai_credits_guardrail_status }}
          GH_AW_DAILY_AI_CREDITS_GUARDRAIL_ERROR: ${{ needs.activation.outputs.daily_ai_credits_guardrail_error }}
          GH_AW_DAILY_AI_CREDITS_TOTAL: ${{ needs.activation.outputs.daily_ai_credits_total }}
          GH_AW_DAILY_AI_CREDITS_ESTIMATED: ${{ needs.activation.outputs.daily_ai_credits_estimated }}
          GH_AW_DAILY_AI_CREDITS_THRESHOLD: ${{ needs.activation.outputs.daily_ai_credits_threshold }}
          GH_AW_DAILY_AI_CREDITS_CONTINUE_ON_ERROR: "false"
          GH_AW_GROUP_REPORTS: "false"
          GH_AW_FAILURE_REPORT_AS_ISSUE: "true"
          GH_AW_MISSING_TOOL_REPORT_AS_FAILURE: "true"
          GH_AW_MISSING_DATA_REPORT_AS_FAILURE: "true"
          GH_AW_TIMEOUT_MINUTES: "90"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'handle_agent_failure.cjs'));
            await main();
      - name: Report failed jobs
        id: report_failed_jobs
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_WORKFLOW_NAME: "Security advisory triage"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/security-triage.md"
          GH_AW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_AW_REPORT_FAILED_JOBS: "true"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'report_failed_jobs.cjs'));
            await main();
      - name: Collect usage artifact files
        if: always()
        continue-on-error: true
        env:
          GH_AW_DETECTION_JOB_RESULT: ${{ needs.detection.result }}
          GH_AW_DETECTION_CONCLUSION: ${{ needs.detection.outputs.detection_conclusion }}
          GH_AW_DETECTION_REASON: ${{ needs.detection.outputs.detection_reason }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/collect_usage_artifact_files.sh"
      - name: Generate usage activity summary and unified session
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_GRADER_MANIFEST_0: '{"version":2,"graders":[]}'
          GH_AW_GRADER_MANIFEST_CHUNKS: '1'
          GH_AW_SAFE_JOB_NAMES: "[\"post_advisory_verdict\"]"
          GH_AW_SAFE_JOB_RESULTS: "{\"post_advisory_verdict\":{\"result\":${{ toJSON(needs.post_advisory_verdict.result) }},\"outputs\":{}}}"
          GH_AW_JOB_DURATIONS: ${{ steps.report_failed_jobs.outputs.job_durations }}
          GH_AW_DAILY_AI_CREDITS_GUARDRAIL_STATUS: ${{ needs.activation.outputs.daily_ai_credits_guardrail_status }}
          GH_AW_DAILY_AI_CREDITS_EXCEEDED: ${{ needs.activation.outputs.daily_ai_credits_exceeded }}
          GH_AW_DAILY_AI_CREDITS_TOTAL: ${{ needs.activation.outputs.daily_ai_credits_total }}
          GH_AW_DAILY_AI_CREDITS_ESTIMATED: ${{ needs.activation.outputs.daily_ai_credits_estimated }}
          GH_AW_DAILY_AI_CREDITS_THRESHOLD: ${{ needs.activation.outputs.daily_ai_credits_threshold }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'generate_usage_artifacts.cjs'));
            await main();
      - name: Upload usage artifact
        id: upload-usage-artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usage
          path: |
            /tmp/gh-aw/usage/aw_session.jsonl
            /tmp/gh-aw/usage/aw_info.json
            /tmp/gh-aw/usage/aw-info.jsonl
            /tmp/gh-aw/usage/agent_usage.json
            /tmp/gh-aw/usage/agent_usage.jsonl
            /tmp/gh-aw/usage/detection_usage.jsonl
            /tmp/gh-aw/usage/evals.jsonl
            /tmp/gh-aw/usage/graders/grader_manifest.json
            /tmp/gh-aw/usage/graders/grader_results.json
            /tmp/gh-aw/usage/github_rate_limits.jsonl
            /tmp/gh-aw/usage/agent/token_usage.jsonl
            /tmp/gh-aw/usage/agent/model-routing.jsonl
            /tmp/gh-aw/usage/agent/execution.json
            /tmp/gh-aw/usage/agent/harness_retry.json
            /tmp/gh-aw/usage/agent/durable-session.jsonl
            /tmp/gh-aw/usage/detection/token_usage.jsonl
            /tmp/gh-aw/usage/detection/execution.json
            /tmp/gh-aw/usage/detection/harness_retry.json
            /tmp/gh-aw/usage/detection/detection_result.json
            /tmp/gh-aw/usage/evals/token_usage.jsonl
            /tmp/gh-aw/usage/evals/execution.json
            /tmp/gh-aw/usage/evals/evals_status.json
            /tmp/gh-aw/usage/experiment/state.jsonl
            /tmp/gh-aw/usage/experiment/state.json
            /tmp/gh-aw/usage/experiment/assignments.json
            /tmp/gh-aw/usage/activity/summary.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}
      - name: Wait before retrying usage artifact upload
        if: always() && steps.upload-usage-artifact.outcome == 'failure'
        run: sleep 10
      - name: Retry upload usage artifact
        id: upload-usage-artifact-retry
        if: always() && steps.upload-usage-artifact.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usage
          path: |
            /tmp/gh-aw/usage/aw_session.jsonl
            /tmp/gh-aw/usage/aw_info.json
            /tmp/gh-aw/usage/aw-info.jsonl
            /tmp/gh-aw/usage/agent_usage.json
            /tmp/gh-aw/usage/agent_usage.jsonl
            /tmp/gh-aw/usage/detection_usage.jsonl
            /tmp/gh-aw/usage/evals.jsonl
            /tmp/gh-aw/usage/graders/grader_manifest.json
            /tmp/gh-aw/usage/graders/grader_results.json
            /tmp/gh-aw/usage/github_rate_limits.jsonl
            /tmp/gh-aw/usage/agent/token_usage.jsonl
            /tmp/gh-aw/usage/agent/model-routing.jsonl
            /tmp/gh-aw/usage/agent/execution.json
            /tmp/gh-aw/usage/agent/harness_retry.json
            /tmp/gh-aw/usage/agent/durable-session.jsonl
            /tmp/gh-aw/usage/detection/token_usage.jsonl
            /tmp/gh-aw/usage/detection/execution.json
            /tmp/gh-aw/usage/detection/harness_retry.json
            /tmp/gh-aw/usage/detection/detection_result.json
            /tmp/gh-aw/usage/evals/token_usage.jsonl
            /tmp/gh-aw/usage/evals/execution.json
            /tmp/gh-aw/usage/evals/evals_status.json
            /tmp/gh-aw/usage/experiment/state.jsonl
            /tmp/gh-aw/usage/experiment/state.json
            /tmp/gh-aw/usage/experiment/assignments.json
            /tmp/gh-aw/usage/activity/summary.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}

  detection:
    name: detection
    needs:
      - activation
      - agent
    if: always() && needs.agent.result != 'skipped'
    runs-on: ubuntu-latest
    # Permissions for the detection job (workflow permissions default to none).
    permissions:
      contents: read
      copilot-requests: write # Authenticate requests to the Copilot engine.
    timeout-minutes: 10
    env:
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      aic: ${{ steps.parse_detection_token_usage.outputs.aic }}
      detection_conclusion: ${{ steps.detection_conclusion.outputs.conclusion }}
      detection_reason: ${{ steps.detection_conclusion.outputs.reason }}
      detection_success: ${{ steps.detection_conclusion.outputs.success }}
      detection_threat_kinds: ${{ steps.detection_conclusion.outputs.threat_kinds }}
      run_detection: ${{ steps.detection_guard.outputs.run_detection }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@53d0749e19424a918acd82b4d140264ce48f2f14 # v1.2.2
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Security advisory triage"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/security-triage.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.103"
          GH_AW_INFO_AWF_VERSION: "v0.29.11"
          GH_AW_INFO_ENGINE_ID: "copilot"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Download activation artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: activation
          path: /tmp/gh-aw
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{agent,agent-output-fallback}"
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          if [ -f "/tmp/gh-aw/agent_output.json" ]; then
            echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Clear agent token usage
        if: always()
        run: rm -f /tmp/gh-aw/agent_usage.json
      - name: Checkout repository for patch context
        if: needs.agent.outputs.has_patch == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --- Threat Detection ---
      - name: Initialize detection execution evidence
        run: |
          mkdir -p "/tmp/gh-aw/threat-detection"
          evidence_tmp="/tmp/gh-aw/threat-detection/execution.json.tmp"
          printf '{"version":1,"component":"detection","run_id":%s,"run_attempt":%s,"state":"not_started"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence_tmp"
          mv "$evidence_tmp" "/tmp/gh-aw/threat-detection/execution.json"
      - name: Clear inherited Copilot session state
        run: rm -rf /tmp/gh-aw/sandbox/agent/logs/copilot-session-state
      - name: Clean stale firewall files from agent artifact
        run: |
          rm -rf /tmp/gh-aw/sandbox/firewall/logs
          rm -rf /tmp/gh-aw/sandbox/firewall/audit
      - name: Download container images
        run: bash "${RUNNER_TEMP}/gh-aw/actions/download_docker_images.sh" ghcr.io/github/gh-aw-firewall/agent:0.29.11@sha256:8774a73c351395b41d2ad0af4ddb4689007c67de3cd08bd9f43bb8a0e300690e ghcr.io/github/gh-aw-firewall/api-proxy:0.29.11@sha256:88d2d0e315a504d93fd4fb8847fd0f6b7f4469f41a6fc6047b3dc9654c56ab2c ghcr.io/github/gh-aw-firewall/squid:0.29.11@sha256:861739ecf924dd2db5e5fb652db2ad82aaafd1615623297ddabc8f41a36b2847
      - name: Check if detection needed
        id: detection_guard
        if: always()
        env:
          OUTPUT_TYPES: ${{ needs.agent.outputs.output_types }}
          HAS_PATCH: ${{ needs.agent.outputs.has_patch }}
        run: |
          if [[ -n "$OUTPUT_TYPES" || "$HAS_PATCH" == "true" ]]; then
            echo "run_detection=true" >> "$GITHUB_OUTPUT"
            echo "Detection will run: output_types=$OUTPUT_TYPES, has_patch=$HAS_PATCH"
          else
            echo "run_detection=false" >> "$GITHUB_OUTPUT"
            echo "Detection skipped: no agent outputs or patches to analyze"
          fi
      - name: Clear MCP Config for detection
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        run: |
          rm -f "${RUNNER_TEMP}/gh-aw/mcp-config/mcp-servers.json"
          rm -f "$HOME/.copilot/mcp-config.json"
          rm -f "$GITHUB_WORKSPACE/.gemini/settings.json"
      - name: Prepare threat detection files
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/prepare_threat_detection_files.sh"
      - name: Setup threat detection
        id: detection_setup
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKFLOW_NAME: "Security advisory triage"
          WORKFLOW_DESCRIPTION: "First-pass triage of unpublished security advisories: tries to reproduce each new or changed report with the\nproject's CLI, suggests a CVSS severity and posts one neutral comment on the advisory for the security team. It never\nchanges severity or state, and never closes or publishes anything."
          HAS_PATCH: ${{ needs.agent.outputs.has_patch }}
          GH_AW_DETECTION_CONTINUE_ON_ERROR: "true"
          GH_AW_DETECTION_SKIP_PROMPT_SUMMARY: "true"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'setup_threat_detection.cjs'));
            await main();
      - name: Ensure threat-detection directory and log
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        run: |
          mkdir -p /tmp/gh-aw/threat-detection
          touch /tmp/gh-aw/threat-detection/detection.log
      - name: Install AWF binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_awf_binary.sh" v0.29.11 --rootless
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install GitHub Copilot CLI
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_copilot_cli.sh" 1.0.103 --checksums-sha256 26cd3e4b32cde498e4961fb4d48e7b85d7859fc69af1a645a19201fdd577bdb2 --prefer-toolcache --cooldown-days 3
        env:
          GH_HOST: github.com
          GITHUB_TOKEN: ${{ github.token }}
          GH_AW_COPILOT_MIN_VERSION: 1.0.35
      - name: Install threat-detect binary
        id: threat_detect_install
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        continue-on-error: true
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/install_threat_detect_binary.sh" v0.5.3 --artifact-base-url https://github.com/github/gh-aw-threat-detection/releases/download --sha256-amd64 7cfab3bd02717968a0584ddd3790cff22550059e36d6f656c4f35e9d27851009 --sha256-arm64 6f355949af98e7b5527a958ac11431bd7867db45c0191b94c3a205c662181cc6
      - name: Execute threat detection with AWF
        id: detection_agentic_execution
        if: always() && steps.detection_guard.outputs.run_detection == 'true' && steps.detection_setup.outcome == 'success' && steps.detection_setup.outputs.ready == 'true' && steps.threat_detect_install.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          AWF_REFLECT_ENABLED: 1
          COPILOT_AGENT_RUNNER_TYPE: STANDALONE
          COPILOT_DUMMY_BYOK: dummy-byok-key-for-offline-mode
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          COPILOT_MODEL: detection
          GH_AW_HARNESS_MAX_RETRIES: 0
          GH_AW_LLM_PROVIDER: github
          GH_AW_MAX_AI_CREDITS: ${{ vars.GH_AW_DEFAULT_DETECTION_MAX_AI_CREDITS || '400' }}
          GH_AW_MAX_TURNS: ${{ vars.GH_AW_DEFAULT_MAX_TURNS || '' }}
          GH_AW_PHASE: detection
          GH_AW_PROMPT: /tmp/gh-aw/aw-prompts/prompt.txt
          GH_AW_TIMEOUT_MINUTES: 10
          GH_AW_VERSION: v1.2.2
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_AW: true
          GITHUB_COPILOT_INTEGRATION_ID: agentic-workflows
          GITHUB_COPILOT_PROMPT_MODE_EXTENSIONS: false
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_STEP_SUMMARY: /tmp/gh-aw/agent-step-summary.md
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          RUNNER_TEMP: ${{ runner.temp }}
          S2STOKENS: true
          TRACEPARENT: ${{ env.GITHUB_AW_OTEL_TRACE_ID != '' && env.GITHUB_AW_OTEL_PARENT_SPAN_ID != '' && format('00-{0}-{1}-01', env.GITHUB_AW_OTEL_TRACE_ID, env.GITHUB_AW_OTEL_PARENT_SPAN_ID) || '' }}
          WORKFLOW_NAME: "Security advisory triage"
          WORKFLOW_DESCRIPTION: "First-pass triage of unpublished security advisories: tries to reproduce each new or changed report with the\nproject's CLI, suggests a CVSS severity and posts one neutral comment on the advisory for the security team. It never\nchanges severity or state, and never closes or publishes anything."
          HAS_PATCH: ${{ needs.agent.outputs.has_patch }}
          GH_AW_DETECTION_CONTINUE_ON_ERROR: "true"
          GH_AW_DETECTION_INPUT_DIR: "/tmp/gh-aw/threat-detection-inputs"
        run: |
          mkdir -p "/tmp/gh-aw/threat-detection"
          evidence_tmp="/tmp/gh-aw/threat-detection/execution.json.tmp"
          printf '{"version":1,"component":"detection","run_id":%s,"run_attempt":%s,"state":"started"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence_tmp"
          mv "$evidence_tmp" "/tmp/gh-aw/threat-detection/execution.json"
          export GH_AW_AWF_EXECUTION_COMPONENT="detection"
          export GH_AW_AWF_EXECUTION_EVIDENCE_FILE="/tmp/gh-aw/threat-detection/execution.json"
          set -o pipefail
          printf '%s' "$(date +%s%3N)" > /tmp/gh-aw/agent_cli_start_ms.txt
          GH_AW_COPILOT_SRC="$(command -v copilot 2>/dev/null || true)"
          if [ -z "$GH_AW_COPILOT_SRC" ] || [ ! -x "$GH_AW_COPILOT_SRC" ]; then
            echo "GitHub Copilot CLI executable not found on PATH after installation" >&2
            exit 127
          fi
          GH_AW_COPILOT_BIN="${RUNNER_TEMP}/gh-aw/bin/copilot"
          mkdir -p "${RUNNER_TEMP}/gh-aw/bin"
          if [ "$GH_AW_COPILOT_SRC" != "$GH_AW_COPILOT_BIN" ]; then
            cp "$GH_AW_COPILOT_SRC" "$GH_AW_COPILOT_BIN"
          fi
          chmod 755 "$GH_AW_COPILOT_BIN"

          (umask 177 && touch /tmp/gh-aw/threat-detection/detection.log)
          GH_AW_MAX_AI_CREDITS="${GH_AW_MAX_AI_CREDITS:-400}"
          if [[ ! "$GH_AW_MAX_AI_CREDITS" =~ ^[0-9]+$ ]]; then
            GH_AW_MAX_AI_CREDITS="400"
          fi

          if [[ "${GH_AW_ADMISSION_RESULT:-}" == "admitted" && -n "${GH_AW_ADMISSION_MAX_AI_CREDITS:-}" ]]; then
