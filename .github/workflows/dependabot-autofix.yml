# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Event-driven, not a schedule sweep — modeled directly on Azure/bicep's copilot-auto-fix.yml
# (https://github.com/Azure/bicep/blob/main/.github/workflows/copilot-auto-fix.yml), which proves this pattern
# works in production. The key fact this design relies on: GitHub's "workflow runs triggered by a Dependabot PR
# get gated behind manual approval" restriction covers pull_request_review, pull_request_review_comment and
# issue_comment — but NOT plain pull_request or workflow_run. Those two got an explicit exemption in 2021 (they
# just respect the workflow's own `permissions:` key) and were never subject to the gate to begin with,
# respectively. Confirmed live on this repo: pull_request_review got stuck at action_required with zero jobs (see
# docs/testing-copilot-dependabot-autofix.md); switching the trigger types below avoids that entirely, no polling
# or manual approval needed.
#
# Two independent jobs:
#   fix-merge-conflicts  — pull_request (opened/synchronize/reopened) on a Dependabot PR; checks mergeStateStatus.
#   fix-failing-checks   — workflow_run of "dependabot test fixture CI" completing with conclusion: failure;
#                          looks up the PR by head branch since workflow_run doesn't carry a PR number.
#
# Note: Dependabot has its own built-in, unrelated auto-rebase-on-conflict behavior (default, undocumented-in-UI
# but confirmed live: a conflict we created was rebased away within ~90s with no comment from us at all). So
# fix-merge-conflicts will rarely get a chance to fire against a plain version-bump conflict in this repo — it
# still matters for a conflict Dependabot's own simple rebase can't resolve (overlapping code changes elsewhere),
# which is the realistic case in a repo with actual application code, unlike this fixture.
#
# Asks @copilot, matching Azure/bicep exactly — NOT a claim Copilot's coding agent is licensed here (it isn't,
# confirmed earlier); this tests that the comment fires correctly through a non-gated event, not that Copilot
# acts on it.
#
# Token scope: `pull-requests: write` only — never `contents: write`, so this workflow's own GITHUB_TOKEN cannot
# merge a PR, push a commit, or delete a branch under any circumstance.

name: "Dependabot autofix"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_run:
    workflows: ["dependabot test fixture CI"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  fix-merge-conflicts:
    name: Ask Copilot to fix merge conflicts
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # GitHub takes a few seconds to compute mergeability after a push — poll until it's no longer UNKNOWN,
      # same gotcha Azure/bicep's version handles the same way.
      - name: Wait for mergeability to be computed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for i in $(seq 1 10); do
            state=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeStateStatus --jq '.mergeStateStatus')
            echo "Attempt $i: mergeStateStatus=$state"
            [[ "$state" != "UNKNOWN" ]] && break
            sleep 10
          done

      - name: Ask Copilot to resolve the conflict, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          state=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeStateStatus --jq '.mergeStateStatus')
          if [[ "$state" != "DIRTY" ]]; then
            echo "Not conflicted (mergeStateStatus=$state)."
            exit 0
          fi

          marker="<!-- dependabot-autofix: conflict $HEAD_SHA -->"
          existing=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json comments \
            --jq ".comments[] | select(.body | contains(\"$marker\")) | .id")
          if [[ -n "$existing" ]]; then
            echo "Already asked about commit $HEAD_SHA, skipping."
            exit 0
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '%s\n@copilot this Dependabot PR has a merge conflict with main. Resolve it, keeping the dependency version bump intact — do not revert the version change itself, only reconcile the surrounding diff.' "$marker")"

  fix-failing-checks:
    name: Ask Copilot to fix a failing check
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      - name: Get PR number for the failed run
        id: get-pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr_number=$(gh pr list --repo "$REPO" --state open --head "$HEAD_BRANCH" \
            --json number,author --jq '.[] | select(.author.login == "app/dependabot") | .number' | head -1)
          if [[ -z "$pr_number" ]]; then
            echo "No open Dependabot PR found for branch $HEAD_BRANCH."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask Copilot to fix it
        if: steps.get-pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          marker="<!-- dependabot-autofix: fix-ci $RUN_ID -->"
          existing=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json comments \
            --jq ".comments[] | select(.body | contains(\"$marker\")) | .id")
          if [[ -n "$existing" ]]; then
            echo "Already asked about run $RUN_ID, skipping."
            exit 0
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '%s\n@copilot the "dependabot test fixture CI" check failed on this Dependabot PR (run: %s). Investigate and fix it so the check passes — if it is because the new version changed an API this repo calls, update the calling code. Only add what is needed to make the build/tests pass; do not touch the dependency version itself.' "$marker" "$RUN_URL")"
