# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Event-driven, modeled on Azure/bicep's copilot-auto-fix.yml
# (https://github.com/Azure/bicep/blob/main/.github/workflows/copilot-auto-fix.yml). The key fact this relies on:
# GitHub gates workflow runs tied to a Dependabot PR behind manual per-run approval for pull_request_review,
# pull_request_review_comment and issue_comment — but NOT plain pull_request or workflow_run (pull_request got an
# explicit 2021 exemption; workflow_run was never in the gated list). Confirmed live on this repo: a
# pull_request_review-triggered version of this got stuck at action_required with zero jobs (see
# docs/testing-copilot-dependabot-autofix.md) before being rebuilt on these two trigger types instead.
#
# fix-merge-conflicts (pull_request: opened/synchronize/reopened) just asks @copilot to resolve a conflict via
# comment — unchanged, low priority: Dependabot has its own built-in auto-rebase-on-conflict behavior (confirmed
# live: resolved a real conflict within ~90s with no comment from us at all), so this rarely gets a chance to
# matter for a plain version-bump conflict.
#
# fix-failing-checks (workflow_run of "dependabot test fixture CI" completing with conclusion: failure) is the
# real implementation: runs the actual `copilot` CLI (https://github.com/github/copilot-cli) as a step in THIS
# job — not a comment asking some external bot to maybe respond. Confirmed live that Copilot CLI authenticates
# fine in this org even though the hosted "coding agent" (@copilot mention) does not — they're governed by
# separate, independent policies per GitHub's own docs. Copilot CLI only gets `write` (file edits) and
# `shell(go build/vet/test:*)` — no git tools at all (`--deny-tool='shell(git:*)'`); this job does the actual
# `git commit`/`git push` itself afterward, and only after re-verifying the build/vet pass independently — never
# trusting Copilot's own self-report. Capped at `--max-ai-credits` per attempt and at 2 attempts total per PR
# (this is NOT free — draws real AI Credits from the org's Copilot plan; see docs/testing-copilot-dependabot-autofix.md).
#
# GITHUB_TOKEN-authored pushes don't trigger new workflow runs (anti-recursion protection), so after pushing a
# fix this explicitly re-runs "dependabot test fixture CI" via workflow_dispatch so the checks tab reflects the
# fix, rather than leaving a stale red X on the pre-fix commit forever.
#
# Token scope: `contents: write` (push the fix), `pull-requests: write` (comment/read), `actions: write`
# (re-trigger CI), `copilot-requests: write` (bill the CLI's usage to the org, per GitHub's docs) — still never
# anything that can merge a PR.

name: "Dependabot autofix"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_run:
    workflows: ["dependabot test fixture CI"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  fix-merge-conflicts:
    name: Ask Copilot to fix merge conflicts
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # GitHub takes a few seconds to compute mergeability after a push — poll until it's no longer UNKNOWN.
      - name: Wait for mergeability to be computed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for i in $(seq 1 10); do
            state=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeStateStatus --jq '.mergeStateStatus')
            echo "Attempt $i: mergeStateStatus=$state"
            [[ "$state" != "UNKNOWN" ]] && break
            sleep 10
          done

      - name: Ask Copilot to resolve the conflict, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          state=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeStateStatus --jq '.mergeStateStatus')
          if [[ "$state" != "DIRTY" ]]; then
            echo "Not conflicted (mergeStateStatus=$state)."
            exit 0
          fi

          marker="<!-- dependabot-autofix: conflict $HEAD_SHA -->"
          existing=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json comments \
            --jq ".comments[] | select(.body | contains(\"$marker\")) | .id")
          if [[ -n "$existing" ]]; then
            echo "Already asked about commit $HEAD_SHA, skipping."
            exit 0
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '%s\n@copilot this Dependabot PR has a merge conflict with main. Resolve it, keeping the dependency version bump intact — do not revert the version change itself, only reconcile the surrounding diff.' "$marker")"

  fix-failing-checks:
    name: Ask Copilot CLI to fix a failing check
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    permissions:
      contents: write
      pull-requests: write
      actions: write
      copilot-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Get PR number for the failed run
        id: get-pr
        run: |
          pr_number=$(gh pr list --repo "$REPO" --state open --head "$HEAD_BRANCH" \
            --json number,author --jq '.[] | select(.author.login == "app/dependabot") | .number' | head -1)
          if [[ -z "$pr_number" ]]; then
            echo "No open Dependabot PR found for branch $HEAD_BRANCH."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Count previous autofix attempts on this PR
        id: attempts
        if: steps.get-pr.outputs.found == 'true'
        env:
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
        run: |
          count=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json comments \
            --jq '[.comments[] | select(.body | contains("<!-- dependabot-ci-autofix:"))] | length')
          echo "Previous attempts on PR #$PR_NUMBER: $count"
          if [[ "$count" -lt 2 ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Give up after 2 attempts
        if: steps.get-pr.outputs.found == 'true' && steps.attempts.outputs.proceed == 'false'
        run: echo "Already tried twice on this PR, not attempting again — needs a human."

      - name: Checkout PR branch
        if: steps.get-pr.outputs.found == 'true' && steps.attempts.outputs.proceed == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.HEAD_BRANCH }}

      - name: Install Copilot CLI
        if: steps.get-pr.outputs.found == 'true' && steps.attempts.outputs.proceed == 'true'
        run: npm install -g @github/copilot

      - name: Ask Copilot CLI to fix the failure
        if: steps.get-pr.outputs.found == 'true' && steps.attempts.outputs.proceed == 'true'
        working-directory: examples/dependabot-test-fixture
        run: |
          copilot -p "The Go build in this directory is failing after a dependency version bump (failed run: $RUN_URL). Run 'go build ./...' and 'go vet ./...' to see the actual error, then edit the .go source files as needed to fix it — do not modify go.mod or go.sum, the dependency version bump itself is correct and must stay exactly as it is. Keep iterating until both commands succeed." \
            -s --allow-tool='write' --allow-tool='shell(go build:*)' --allow-tool='shell(go vet:*)' --allow-tool='shell(go test:*)' \
            --deny-tool='shell(git:*)' --max-ai-credits 30

      - name: Verify the fix actually builds (never trust Copilot's own self-report)
        id: verify
        if: steps.get-pr.outputs.found == 'true' && steps.attempts.outputs.proceed == 'true'
        working-directory: examples/dependabot-test-fixture
        run: |
          if go build ./... && go vet ./...; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, push, and re-trigger CI
        if: steps.get-pr.outputs.found == 'true' && steps.attempts.outputs.proceed == 'true' && steps.verify.outputs.verified == 'true'
        env:
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Copilot made no changes; nothing to push."
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '<!-- dependabot-ci-autofix: run %s --><br>Copilot CLI looked at the failing check (%s) but made no changes. Needs a human.' "$RUN_ID" "$RUN_URL")"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$(printf 'Auto-fix: resolve build failure after dependency bump\n\nFixed by Copilot CLI in response to failed run %s.\nVerified locally with go build && go vet before pushing.' "$RUN_URL")"
          git push origin "HEAD:$HEAD_BRANCH"

          # GITHUB_TOKEN-authored pushes don't trigger new workflow runs, so kick CI explicitly.
          gh workflow run "dependabot-test-fixture-ci.yml" --repo "$REPO" --ref "$HEAD_BRANCH"

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '<!-- dependabot-ci-autofix: run %s --><br>Copilot CLI fixed the failing check (%s) and pushed a commit. Re-running CI now.' "$RUN_ID" "$RUN_URL")"

      - name: Comment if the fix did not verify
        if: steps.get-pr.outputs.found == 'true' && steps.attempts.outputs.proceed == 'true' && steps.verify.outputs.verified == 'false'
        env:
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '<!-- dependabot-ci-autofix: run %s --><br>Copilot CLI attempted to fix the failing check (%s) but the fix did not verify locally (go build/go vet still failing). Needs a human.' "$RUN_ID" "$RUN_URL")"
