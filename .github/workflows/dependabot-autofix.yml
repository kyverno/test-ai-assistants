# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Fully automatic — no maintainer comment involved. Sweeps open Dependabot PRs on a schedule (see
# docs/testing-copilot-dependabot-autofix.md for why: pull_request_review-triggered runs on a Dependabot PR get
# stuck at action_required, needing a maintainer to click "Approve and run" on EVERY run, not once — confirmed
# live on this repo). For each one, checks its current state — a merge conflict with the base branch, or a check
# that's already finished and failed — and fixes whichever applies.
#
# A conflict gets `@dependabot rebase` — a real, native, documented Dependabot comment command (no installation
# or licensing dependency at all, unlike everything below): it re-applies the same version bump on latest main,
# which is exactly what a conflict caused by main moving forward needs.
#
# A failing check has no equivalent native fix — `@dependabot rebase` only re-applies the SAME diff, it can't
# write code to fix a real incompatibility the new version introduced. That needs an actual coding agent. Copilot's
# code-review capability is confirmed working in this org, but its coding agent (which would fix things itself via
# an @copilot mention) is not currently licensed here. CodeRabbit's `@coderabbitai fix-ci commit` comment command
# is used as the fallback instead — NOT YET CONFIRMED installed on this specific repo (no coderabbitai activity
# seen on any PR here so far). Until it is, this half of the loop can only be tested as far as "the comment posts
# correctly," not "something acts on it." If Copilot's coding agent becomes licensed later, point this back at
# @copilot instead.
#
# Why a sweep and not a push/CI-failure event: a Dependabot PR can also drift into conflict purely because `main`
# moved on, with no new push to the PR itself — GitHub emits no `pull_request` event for that, so a
# push-triggered design would miss it. A sweep just looks again next interval regardless.
#
# Token scope: `pull-requests: write` (comment) and `checks: read` (read check-run state) only — never
# `contents: write`, so this workflow's own GITHUB_TOKEN cannot merge a PR, push a commit, or delete a branch
# under any circumstance. What it can do is post a comment; CodeRabbit then acts under its own GitHub App
# credential, not this token.

name: "Dependabot autofix"

permissions: {}

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

jobs:
  fix-if-needed:
    name: Fix any broken Dependabot PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Sweep open Dependabot PRs
        run: |
          set -euo pipefail

          # gh's --json author is GraphQL-backed and reports Dependabot's login as "app/dependabot" — NOT
          # "dependabot[bot]", the REST/webhook form (e.g. copilot-auto-request.yml's
          # github.event.pull_request.user.login). Confirmed live in dependabot-autofix.yml's predecessor.
          pr_numbers=$(gh pr list --repo "$REPO" --state open --json number,author \
            --jq '.[] | select(.author.login == "app/dependabot") | .number')

          if [[ -z "$pr_numbers" ]]; then
            echo "No open Dependabot PRs."
            exit 0
          fi

          for pr_number in $pr_numbers; do
            echo "::group::PR #$pr_number"

            pr_json=$(gh pr view "$pr_number" --repo "$REPO" --json mergeStateStatus,headRefOid,comments)
            mergeable_state=$(jq -r '.mergeStateStatus' <<<"$pr_json")
            head_sha=$(jq -r '.headRefOid' <<<"$pr_json")
            existing_comments=$(jq -r '.comments[].body' <<<"$pr_json")

            has_conflict=false
            [[ "$mergeable_state" == "DIRTY" ]] && has_conflict=true

            # Only checks that have already completed and failed — a still-pending check isn't a failure yet.
            # ACTION_REQUIRED included because the DCO probot app reports a missing sign-off with that
            # conclusion, not FAILURE/ERROR — confirmed live in pr-readiness-check.yml's dco_failing check.
            failing_checks=$(gh pr checks "$pr_number" --repo "$REPO" --json state \
              --jq '[.[] | select(.state == "FAILURE" or .state == "ERROR" or .state == "ACTION_REQUIRED")] | length')

            if [[ "$has_conflict" == "false" && "$failing_checks" == "0" ]]; then
              echo "Nothing broken — merge state is $mergeable_state, no completed checks are failing."
              echo "::endgroup::"
              continue
            fi

            # Two independent markers, one per condition, so a PR that's both conflicted and CI-failing gets
            # both asks, and each is deduped on its own — fixing one doesn't suppress re-asking about the other.
            if [[ "$has_conflict" == "true" ]]; then
              marker="<!-- dependabot-autofix: conflict $head_sha -->"
              if grep -qF -- "$marker" <<<"$existing_comments"; then
                echo "Already asked Dependabot to rebase commit $head_sha, skipping."
              else
                gh pr comment "$pr_number" --repo "$REPO" \
                  --body "$(printf '%s\n@dependabot rebase' "$marker")"
              fi
            fi

            if [[ "$failing_checks" != "0" ]]; then
              marker="<!-- dependabot-autofix: fix-ci $head_sha -->"
              if grep -qF -- "$marker" <<<"$existing_comments"; then
                echo "Already asked CodeRabbit to fix CI on commit $head_sha, skipping."
              else
                gh pr comment "$pr_number" --repo "$REPO" \
                  --body "$(printf '%s\n@coderabbitai fix-ci commit' "$marker")"
              fi
            fi

            echo "::endgroup::"
          done
